<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1d4ed8">
<title>Кори Озмоишӣ Химия</title>
<style>
:root{--r:#dc2626;--b:#1d4ed8;--bg:#f3f6fd;--c:#fff;--t:#111827;--m:#6b7280}
@media(prefers-color-scheme:dark){:root{--bg:#0f172a;--c:#1e293b;--t:#f1f5f9;--m:#94a3b8}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--t);line-height:1.55}
header{background:linear-gradient(135deg,var(--b),var(--r));color:#fff;padding:18px 14px 14px;text-align:center;position:sticky;top:0;z-index:5}
h1{margin:0;font-size:22px;letter-spacing:.5px}
header p{margin:2px 0 10px;font-size:13px;opacity:.9}
#q{width:100%;max-width:520px;padding:10px 14px;border:0;border-radius:22px;font-size:15px}
nav{display:flex;gap:8px;padding:12px;overflow-x:auto}
nav button{flex:1 0 auto;padding:10px 14px;border:2px solid var(--b);background:var(--c);color:var(--b);border-radius:12px;font-weight:700;font-size:14px}
nav button.on{background:var(--b);color:#fff}
main{max-width:720px;margin:0 auto;padding:0 12px 40px}
.lab h2{margin:6px 0 2px;font-size:19px;color:var(--r)}
.lab .s{color:var(--m);margin:0 0 10px;font-weight:600}
.box{background:var(--c);border-radius:14px;padding:12px 14px;margin:10px 0;box-shadow:0 1px 4px #0002}
.box.e{border-left:5px solid var(--b)}
.box.k{border-left:5px solid var(--r)}
.box b.h{display:block;color:var(--b);margin-bottom:4px}
.box.k b.h{color:var(--r)}
.box ol{margin:4px 0;padding-left:20px}
.box li{margin:6px 0}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
td,th{border:1px solid var(--m);padding:5px;text-align:center}
th{background:var(--b);color:#fff}
mark{background:#fde047;color:#000}
.empty{text-align:center;color:var(--m);padding:30px}
</style>
</head>
<body>
<header>
<h1>🧪 Кори Озмоишӣ Химия</h1>
<p>ENGLISH FIRUZ</p>
<input id="q" placeholder="Ҷустуҷӯ… (масалан: мис, кислота)" oninput="draw()">
</header>
<nav id="nav"></nav>
<main id="app"></main>
<script>
const L=[
{t:"Кори озмоишии № 1",s:"Синфи пайвастаҳои кимиёӣ",
eq:"Штатив бо пробиркаҳо, спиртовка ё гармкунаки барқӣ, шпател, пробиркақапак, чӯбчаи шишагин. Маҳлулҳои HCl, H₂SO₄ (0,2 н.), NaOH (0,2 н.), CuSO₄ (0,5 н.), FeCl₃, Ca(OH)₂, P₂O₅ (сахт), CaO ё BaO (сахт), мармар (CaCO₃).",
g:[
{n:"Оксидҳо"},
{h:"Таҷрибаи 1. Гидратацияи оксидҳои асосӣ",p:["а) Дар пробирка каме оксиди калсийи хушк CaO ё оксиди барийро BaO гузошта, ба болояш 1–2 мл об илова кунед. Маҳсулоти пробиркаро такон дода, бо ёрии қоғази индикатории муҳити реаксияро санҷед. Ҳалшавандагии сусти оксиди калсий ё оксиди барийро қайд кунед. Муодилаи реаксияро тартиб диҳед.","б) Таҷрибаи монандро бо оксиди мис гузаронед. Оё ранги индикатор тағйир меёбад? Оид ба таъсири мутақобилаи оксидҳо бо об чӣ гуна хулоса баровардан мумкин аст?"]},
{h:"Таҷрибаи 2. Гидратацияи оксидҳои кислотагӣ",p:["а) Дар пробиркаи хушк каме оксиди фосфорро P₂O₅ ҷой кунед. Ба болояш 2 мл об илова кунед. Реаксияи оксиди фосфор бо об чӣ гуна мегузарад? Муҳити реаксияро бо қоғази индикатории универсалӣ санҷед. Чӣ ҳосил шуд? Муодилаи реаксияро нависед.","б) Ба пробирка каме оксиди силитсийро (рег) гирифта, ба болояш 1–2 мл оби муққатар илова кунед. Омехтаро такон диҳед. Муҳити реаксияро санҷед. Кадом хулосаҳоро баровардан мумкин аст?","в) Ба пробирка 5 мл об рехта, ба он якчанд қатра маҳлули индикатори метилоранж ё қоғази индикатории универсалиро илова кунед ва ба он чараёни диоксиди карбонро сар диҳед. Ранги индикатор чӣ гуна иваз мешавад? Чӣ ҳосил шуд? Муодилаи реаксияро нависед."]},
{n:"Асосҳо ва кислотаҳо"},
{h:"Таҷрибаи 3. Ҳосил кардани асосҳои ҳалнашаванда",p:["Дар чор пробирка 1–2 мл-рӣ маҳлулҳои намакҳои оҳан, мис, никел ва кобалт резед. Дар ҳамаи пробиркаҳо 2 миллилитрӣ маҳлули 0,2 н гидроксиди натрий илова кунед. Ҳосилшавии тахшон ва ранги онро қайд кунед. Муодилаи реаксияро тартиб диҳед."]},
{h:"Таҷрибаи 4. Вайроншавии гидроксиди мис",p:["Тахшони аз таҷрибаи қаблӣ ҳосилшударо дар шӯълаи спиртовка ё гармкунаки барқӣ то ҳосилшудани тахшони сиёҳ гарм кунед. Муодилаи реаксияи вайроншавии гидроксиди мисро тартиб диҳед."]},
{h:"Таҷрибаи 5. Таъсири кислотаҳо бо оксидҳои асосӣ",p:["Дар пробирка 0,5 г оксиди мис гирифта, ба он 3 мл маҳлули кислотаи хлориди ё сулфат резед. Пробиркаро такон дода, онро гузоред каме истад. Чиро мушоҳида мекунед? Муодилаи реаксияро нависед."]},
{h:"Таҷрибаи 6. Таъсири кислотаҳо бо намакҳо",p:["Дар пробирка 2 г мармарро гирифта, ба болояш 5 мл маҳлули кислотаи хлорид ё сулфат резед. Хориҷшавии газро қайд кунед. Муодилаи реаксияро нависед."]},
{h:"Таҷрибаи 7. Таъсири кислотаҳо бо металлҳо",p:["Ба ду пробирка 3 мл-рӣ кислотаи хлориди ё сулфат резед. Ба пробиркаи якум порачаи рӯҳ, ба дуюмаш пораи алюминийро илова кунед. Хориҷшавии газро мушоҳида кунед. Кадом газ хориҷ шудааст. Муодилаи реаксияро нависед."]},
{n:"Намакҳо"},
{h:"Таҷрибаи 8. Ҳосилшавии намакҳои ҳалнашаванда",p:["Ба ду пробирка 2 мл маҳлули хлориди барий ва хлориди калсий резед. Ба ҳар ду пробиркаҳо 2 мл-рӣ маҳлули кислотаи сулфат илова кунед. Чиро мушоҳида мекунед? Муодилаи реаксияро нависед."]},
{h:"Таҷрибаи 9. Таъсири намакҳо бо металлҳо",p:["Ба пробиркаҳое, ки 3 мл-рӣ маҳлулҳои аммоний мис, натрий ва сурб доранд, як порачагӣ рӯҳ илова карда гузоред истанд. Чиро мушоҳида мекунед? Муодилаи реаксияро нависед."]}
],
q:["Кадоме аз оксидҳои овардашуда оксидҳои асосӣ мебошанд: CaO, N₂O₅, Li₂O, SO₂?","Кадоме аз оксидҳои овардашуда оксидҳои кислотагӣ мебошанд: CO₂, P₂O₅, MgO, Al₂O₃?","Кадоме аз моддаҳои овардашуда бо кислотаи сулфат таъсири мутақобила доранд: HCl, BaO, SO₂, NaOH? Муодилаи реаксияро нависед."]},

{t:"Кори озмоишии № 2",s:"Суръати реаксияи химиявӣ ва мувозинати химиявӣ",
eq:"Штатив бо пробиркаҳо, стаканҳои кимиёвӣ барои 50 мл, плиткаи барқӣ, шпателҳо, чӯбчаҳои шишагин, секундомер; тиосулфатии натрий (1М), кислотаи сулфат (2н.), кислотаи хлорид (2н.), хлориди оҳан(III) (сахт), роданиди калий ё аммоний (1 н.).",
g:[
{n:"Суръати реаксия"},
{h:"Таҷрибаи 1. Таъсири ғализат ба суръати реаксия",p:["Аз чадвали зер истифода бурда дар се пробирка маҳлули тиосулфати натрий гализаташ гуногун резед, ба ҳар як пробирка кислотаи сулфати 2н илова кунед. Ҳисоби вақтро аз лаҳзаи омехта кардани маҳлули тиосулфати натрий бо кислотаи сулфат сар карда то пайдо шудани тахшони тирай сулфур давом диҳед.","Na₂S₂O₃ + H₂SO₄ = Na₂SO₄ + S↓ + SO₂↑ + H₂O","Оиди таъсири ғализати моддаҳои ба реаксия дохилшаванда ба суръати реаксия хулоса баровардаед. Дар тири абсисс ғализатро гузошта, дар тири ордината суръати мувофиқро дар вохиди шартӣ гузоред."],
tb:[["№ пробирка","Na₂S₂O₃, мл","H₂O, мл","H₂SO₄, мл","Вақт τ, сон","Суръат V=1/τ"],["1","6","0","6","",""],["2","4","2","6","",""],["3","3","3","6","",""],["4","2","4","6","",""]]},
{h:"Таҷрибаи 2. Вобастагии суръати реаксия аз ҳарорат",p:["Ба се пробиркаи калон 5 мл-рӣ маҳлули тиосулфати натрий, дар сетои дигар 5 мл-рӣ маҳлули кислотаи сулфат гирифта онҳоро се ҷуфт кунед: ҳар як ҷуфт якчоя пробиркаи тиосулфати натрий ва кислотаи сулфат. Ҳарорати ҳавои озмоишгоҳро санҷида, ҷуфти якумро якҷоя кунед ва пас аз чанд сония маҳлул тира мешавад. Ҷуфти дуюми пробиркаҳоро дар доҳили обии гузошта оби ҳамомчаи обиро ба 10 дараҷа зиёдтар (аз ҳарорати хона) гарм кунед. Ҷуфти сеюмро ба 20 дараҷа аз ҳарорати хона баландтар кунед. Натиҷаҳоро ба ҷадвал гузаронед.","Дар тири абсисса ҳарорат ва дар тири ордината суръати реаксияро гузошта, графики вобастагии суръати реаксияро аз ҳарорат созед."],
tb:[["№","Na₂S₂O₃, мл","H₂SO₄, мл","Ҳарорат °C","τ, сон","V=1/τ"],["1","5","5","","",""],["2","5","5","","",""],["3","5","5","","",""]]},
{n:"Мувозинати химиявӣ"},
{h:"Таҷрибаи 3. Таъсири ғализат ба лағжиши мувозинати химиявӣ",p:["Ба стакони кимиёвӣ (100 мл) 10 мл маҳлули 0,001 н хлориди оҳани (III) ва 10 мл роданиди калий (ё аммоний)-ро омехта кунед. Ранги сурхи маҳлул чиро мефаҳмонад? Маҳлули ҳосилшударо ба чор пробирка тақсим кунед. Якто ашро барои муқоиса гузошта, ба се тои дигарашон маҳлулҳои консентронидашудаи хлориди оҳан, маҳлули роданиди калий ва хлориди калийи хушк илова кунед. Тағйирёбии ранги маҳлулҳоро дар асоси принсипи Ле-Шателье шарҳ диҳед."]}
],
q:["Ифодаи суръати реаксияро нависед: 2A(газ) + 3B(газ) = C.","Ҳангоми ду маротиба зиёд кардани ғализати H₂ суръати реаксияи 2H₂ + O₂ = 2H₂O чӣ гуна тағйир меёбад?","Ҳангоми ду маротиба зиёд намудани фишор суръати реаксияи 2CO + O₂ = 2CO₂ чӣ гуна тағйир меёбад?","Суръати реаксия аз кадом омилҳо вобаста аст?","Ҳарорат ба суръати реаксия чӣ таъсир мерасонад?","Мувозинати реаксияҳои зерин ба кадом тараф мелағжанд: H₂ + I₂ = 2HI + Q ва 3H₂ + N₂ = 2NH₃ − Q. Ҳангоми баланд шудани фишор? паст шудани фишор? баланд шудани ҳарорат? паст шудани ҳарорат? зиёд шудани ғализати H₂? паст шудани ғализати H₂?"]},

{t:"Кори озмоишии № 3",s:"Хосиятҳои маҳлулҳо. Тайёр намудани маҳлулҳо",
eq:"Стаканҳои кимиёӣ, силиндрҳои ченакдор, чӯбчаҳои шишагин, термометр, тарозуи техникӣ, сангҳои тарозуӣ, ареометр, плиткаи барқӣ. Маҳлули қанд, спирти этил, гидроксиди калий ё натрий, нитрати аммоний, сулфати калий, сулфати натрий, хлориди натрий, ягон навъ модаи хушк, маҳлули консентронидашуда бо салоҳдиди омӯзгор.",
g:[
{h:"Таҷрибаи 1. Эффекти гармӣ ҳангоми ҳалшавӣ",p:["а) Ба стакони ҳаҷмаш 50 мл 10 мл об резед. Ба об 5 г нитрати аммоний илова намуда, маҳлулро омехта карда онро ҳал кунонед. Ҳарорати маҳлули ҳосилшударо бо термометр санҷед.","б) Таҷрибаи монандро бо гидроксиди натрий ё калий гузаронед. Дар ин ҳолат эффекти гармӣ чӣ гуна аст?"]},
{h:"Таҷрибаи 2. Таъсири ҳарорат ба ҳалшавандагӣ",p:["Ба пробирка 0,5 г сулфати калий гиред. Ба он 5 мл об илова намуда омехта кунед. Маҳлулро қариб то чӯшиш гарм кунед. Оё ҳама намак ҳал шуд? Чӣ ҳодиса рӯй дод? Таҷрибаи монандро бо хлориди натрий ва сулфати натрий гузаронед. Чи гуна хулоса баровардан мумкин аст?"]},
{h:"Таҷрибаи 3. Муайян намудани зичии маҳлул бо ареометр",p:["Маҳлули тадқиқшавандаро ба силиндри калон резед. Сатҳи моеъ бояд якчанд см поёнтар аз канори силиндр бошад. Оҳиста ба силиндр ареометрро андозед. Нӯги ареометрро раҳо накунед то вақте, ки маълум шавад ки вай шино мекунад (ғарқ нашавад). Ареометр бояд дар байни силиндр қарор дошта бошад. Вай набояд ба деворҳо ё таги силиндр расад. Ҳисобро аз рӯи шкалаи ареометр дар муқобили мениски моеъ (сатҳи фурӯхамида ё барчастаи чизи моеъ) муайян кунед. Пас аз анҷоми кор ареометрро бо об шуста бо қоғази филтркунанда хушк намоед ва ба қуттӣ ҷойгир кунед. Аз ҷадвал истифода бурда аз рӯи зиччӣ ғализати маҳлулро муайян кунед."]},
{h:"Таҷрибаи 4. Омода намудани маҳлул бо ғализати муайян",p:["а) Аз моддаи хушк."]}
],q:[]}
];
let cur=0;
const nav=document.getElementById('nav');
L.forEach((l,i)=>{const b=document.createElement('button');b.textContent='№ '+(i+1);b.onclick=()=>{cur=i;draw()};nav.appendChild(b)});
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function draw(){
 const k=document.getElementById('q').value.trim().toLowerCase();
 [...nav.children].forEach((b,i)=>b.className=i==cur&&!k?'on':'');
 const hl=s=>{s=esc(s);if(!k)return s;const i=s.toLowerCase().indexOf(k);return i<0?s:s.slice(0,i)+'<mark>'+s.slice(i,i+k.length)+'</mark>'+s.slice(i+k.length)};
 const has=x=>!k||JSON.stringify(x).toLowerCase().includes(k);
 let out='';
 (k?L.map((_,i)=>i):[cur]).forEach(i=>{
  const l=L[i];let h='';
  if(has(l.eq)&&(!k||l.eq.toLowerCase().includes(k)))h+=`<div class="box"><b class="h">Асбобҳо ва реактивҳо</b>${hl(l.eq)}</div>`;
  l.g.forEach(e=>{
   if(e.n){if(!k)h+=`<h3 style="color:var(--b);margin:16px 0 0">${e.n}</h3>`;return}
   if(!has(e))return;
   h+=`<div class="box e"><b class="h">${hl(e.h)}</b>`+e.p.map(p=>`<p>${hl(p)}</p>`).join('');
   if(e.tb)h+='<table>'+e.tb.map((r,j)=>'<tr>'+r.map(c=>j?`<td>${c||'&nbsp;'}</td>`:`<th>${c}</th>`).join('')+'</tr>').join('')+'</table>';
   h+='</div>';
  });
  if(l.q.length&&has(l.q))h+=`<div class="box k"><b class="h">Саволҳои назоратӣ ва масъалаҳо</b><ol>${l.q.map(x=>(!k||x.toLowerCase().includes(k))?`<li>${hl(x)}</li>`:'').join('')}</ol></div>`;
  if(h)out+=`<section class="lab"><h2>${l.t}</h2><p class="s">${l.s}</p>${h}</section>`;
 });
 document.getElementById('app').innerHTML=out||'<div class="empty">Чизе ёфт нашуд</div>';
}
draw();
</script>
</body>
</html>
